name: "Astra Manual Trigger"

on:
  workflow_dispatch:
    inputs:
      skip_warp:
        description: 'Skip WARP connection'
        required: false
        default: 'false'
      headed:
        description: 'Run browser in headed mode (for debugging)'
        required: false
        default: 'false'

jobs:
  manual_run:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: "Clone Repository"
        uses: actions/checkout@v4

      - name: "Layer 1: Network Obfuscation (WARP)"
        if: ${{ github.event.inputs.skip_warp != 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl gnupg
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-warp.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos register
          warp-cli --accept-tos connect
          sleep 5
          curl -s https://www.cloudflare.com/cdn-cgi/trace | grep "warp=on"

      - name: "Python & Dependencies"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "Install Playwright"
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: "State Recovery"
        uses: actions/download-artifact@v4
        with:
          name: astra-state-data
          path: ./data/
        continue-on-error: true

      - name: "Manual Execution"
        env:
          GEMINI_COOKIES: ${{ secrets.GEMINI_COOKIES }}
          SCHEDULER_COOKIES: ${{ secrets.SCHEDULER_COOKIES }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SKIP_WARP: ${{ github.event.inputs.skip_warp }}
          HEADED: ${{ github.event.inputs.headed }}
        run: python -m src

      - name: "Upload Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-manual-run
          path: |
            data/state_log.json
            media/error_logs/
            media/exports/
          retention-days: 3
