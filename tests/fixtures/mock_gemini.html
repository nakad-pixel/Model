<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini</title>
    <style>
        body { font-family: 'Google Sans', sans-serif; margin: 0; padding: 0; background: #fff; }
        .header { padding: 16px 24px; border-bottom: 1px solid #e8eaed; display: flex; align-items: center; }
        .logo { font-size: 22px; font-weight: 500; color: #1a73e8; }
        .chat { max-width: 720px; margin: 0 auto; padding: 24px; }
        .message { display: flex; gap: 12px; margin-bottom: 16px; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background: #1a73e8; flex-shrink: 0; }
        .bubble { background: #f1f3f4; padding: 12px 16px; border-radius: 18px; max-width: 80%; }
        .input-area {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #fff; border-top: 1px solid #e8eaed; padding: 12px 24px;
            display: flex; gap: 12px; align-items: flex-end;
        }
        .input-box {
            flex: 1; border: 1px solid #dadce0; border-radius: 24px;
            padding: 12px 20px; font-size: 15px; outline: none;
        }
        .send-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: #1a73e8; color: #fff; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .generated-image {
            max-width: 100%; border-radius: 12px; margin-top: 12px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">Gemini</div>
    </header>
    <main class="chat" id="chat">
        <div class="message">
            <div class="avatar"></div>
            <div class="bubble">Hello! I'm Gemini. How can I help you today?</div>
        </div>
    </main>
    <div class="input-area">
        <div class="input-box" role="textbox" contenteditable="true" id="prompt-input" placeholder="Enter a prompt here"></div>
        <button class="send-btn" id="send-btn" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
        </button>
    </div>
    <script>
        const input = document.getElementById('prompt-input');
        const sendBtn = document.getElementById('send-btn');
        const chat = document.getElementById('chat');

        sendBtn.addEventListener('click', () => {
            const text = input.innerText.trim();
            if (!text) return;

            // Add user message
            const userMsg = document.createElement('div');
            userMsg.className = 'message';
            userMsg.innerHTML = '<div class="avatar" style="background:#e8eaed"></div><div class="bubble" style="background:#e3f2fd">' + text + '</div>';
            chat.appendChild(userMsg);

            input.innerText = '';

            // Simulate AI response with generated image after delay
            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message';
                aiMsg.innerHTML = `
                    <div class="avatar"></div>
                    <div class="bubble">
                        Here's the image you requested!
                        <img class="generated-image" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" alt="Generated image" />
                    </div>
                `;
                chat.appendChild(aiMsg);
            }, 2000);
        });
    </script>
</body>
</html>
